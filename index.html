<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' https:; object-src 'none'; base-uri 'self'">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
<meta name="apple-mobile-web-app-title" content="Monomyth">

<title>MONOMYTH</title>
<link rel="stylesheet" href="./fonts.css">
<link rel="stylesheet" href="./sword.css">
</head>
<body data-page="day-one" class="portal">
<div id="storypane"><div id="flow"></div></div>
<div id="barrier" role="separator" aria-orientation="horizontal" aria-label="the one thing: drag to move">
  <div class="crystals" aria-hidden="true"><div class="drift" id="crystals"></div></div>
  <div class="one"><span class="word" id="one"></span></div>
  <div class="numbers" aria-hidden="true"><div class="drift" id="numbers"></div></div>
</div>
<div id="chat">
  <div id="chatlines"></div>
  <div id="keyrow" hidden><input id="keyin" type="password" autocomplete="off" placeholder="a key looses his mouth"><button type="button" id="keysave">keep</button></div>
  <div class="chatrow"><textarea id="chatin" rows="1" placeholder="say it to Orv"></textarea><button type="button" id="chatsend">send</button></div>
  <div class="feet">
    <label for="scanfile">upload kingdom</label><input type="file" id="scanfile" accept="image/png,image/gif,image/*">
    <button type="button" id="glyphbtn">save kingdom</button>
    <span id="scannote"></span><span id="feetnote"></span>
  </div>
</div>
<button type="button" id="orvbtn" aria-label="Orv"><canvas id="orvsprite" width="41" height="50"></canvas></button>
<div hidden><span id="orvword"></span><button type="button" id="chatclose"></button><button type="button" id="actbtn"></button><button type="button" id="shutAll"></button><button type="button" id="backup"></button><input type="file" id="restorefile"><span id="tally"></span></div>
<div id="mark" hidden>
  <div class="chathead"><span class="who">KINGDOM</span><span id="markhead"></span><button type="button" id="markclose">close</button></div>
  <div id="markbody"></div>
  <p class="markhow">The kingdom rides in Orv, one picture. Save him to Photos or take a screenshot; upload kingdom reads him back.</p>
  <div class="chatrow"><button type="button" id="glyphsave">save the kingdom</button></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<script src="./vendor/omggif.js"></script>

<script src="./sword.js"></script>
</body>
</html>
